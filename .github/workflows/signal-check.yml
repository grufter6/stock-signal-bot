name: Signal check

on:
  schedule:
    # every 5 min, 13:00-20:55 UTC, Mon-Fri — wide enough to cover US market
    # hours (9:30am-4pm ET) across both EST and EDT. The script itself checks
    # real market hours (DST-aware) and exits instantly outside them.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python signal_check.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "stock-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/notified_today.json state/live_quotes.json state/signal_log.json
          git diff --cached --quiet || git commit -m "update notification dedupe state"
          git push
